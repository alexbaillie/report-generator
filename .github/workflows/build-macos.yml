name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build backend (PyInstaller spec)
        run: |
          pyinstaller --noconfirm pyinstaller.spec

      - name: Verify backend output folder exists
        run: |
          test -d dist/report_generator_backend
          ls -la dist/report_generator_backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # IMPORTANT: do NOT run `npm run electron:build` on macOS because it triggers
      # `preelectron:build` which is a PowerShell script.
      - name: Build Electron macOS artifact(s)
        working-directory: frontend
        run: npx electron-builder --mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/*.yml
            frontend/release/latest-mac.yml

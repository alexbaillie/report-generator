name: Build Linux

# Builds the Linux app (an AppImage for x64 and arm64) and proves it works on a real
# Linux machine: backend tests, the packaged backend, the packaged AppImage (start,
# use, quit, nothing left running) and the bundled Ollama with an actual model.
# Download the .AppImage from the run's artifacts; tag pushes (v*) build too.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the verified AppImages to this existing GitHub release (e.g. v1.1.0-beta). Leave empty to only build."
        required: false
        default: ""
  push:
    branches:
      - linux-build   # TEMPORARY: lets the branch run before the workflow is on the default branch
    tags:
      - "v*"

permissions:
  contents: write   # only used to attach AppImages to a release when release_tag is given

env:
  # The Ollama release bundled in the Windows and macOS builds; Linux uses the same one.
  OLLAMA_VERSION: v0.33.1

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on Ubuntu 22.04 (glibc 2.35) so it also runs on older distros.
          - arch: x64
            runner: ubuntu-22.04
            ollama_arch: amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            ollama_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # Ollama's Linux runtime alone is several GB unpacked; the default runner is tight.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -n 1

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zstd libfuse2 libnss3 libgbm1 libasound2 libgtk-3-0 \
            libxss1 libxtst6 libatk-bridge2.0-0 libcups2 libdrm2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Build the backend (PyInstaller, one-folder)
        run: bash build_exe.sh

      - name: Smoke-test the packaged backend
        run: |
          (cd dist/report_generator_backend && ./report_generator_backend > "$RUNNER_TEMP/backend.log" 2>&1 &)
          python .github/scripts/smoke_test_backend.py --base http://127.0.0.1:8000 || { tail -n 60 "$RUNNER_TEMP/backend.log"; exit 1; }
          pkill -f report_generator_backend || true
          test -f "${XDG_DATA_HOME:-$HOME/.local/share}/PsychReportGen/data/reports.db"
          rm -rf "${XDG_DATA_HOME:-$HOME/.local/share}/PsychReportGen"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the frontend
        working-directory: frontend
        run: npm run build

      - name: Download the Ollama Linux runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ollama/linux
          archive="ollama-linux-${{ matrix.ollama_arch }}.tar.zst"
          for attempt in 1 2 3; do
            gh release download "$OLLAMA_VERSION" --repo ollama/ollama --pattern "$archive" \
              --dir "$RUNNER_TEMP" --clobber && break
            echo "download attempt $attempt failed"; sleep 10
          done
          tar --zstd -xf "$RUNNER_TEMP/$archive" -C ollama/linux
          rm -f "$RUNNER_TEMP/$archive"
          echo "=== layout ==="; ls -la ollama/linux ollama/linux/bin
          echo "=== sizes under lib/ollama ==="; du -sh ollama/linux/lib/ollama/* 2>/dev/null | sort -h | tail -n 12
          echo "=== total ==="; du -sh ollama/linux
          file ollama/linux/bin/ollama

      - name: Build the Electron app (AppImage)
        working-directory: frontend
        run: npx electron-builder --linux --${{ matrix.arch }}

      - name: Inspect the build
        run: |
          ls -la frontend/release
          APPIMAGE="$(ls frontend/release/*.AppImage | head -1)"
          size=$(stat -c %s "$APPIMAGE")
          echo "AppImage: $APPIMAGE  $((size / 1048576)) MiB"
          file "$APPIMAGE" | cut -c1-160
          echo "UNPACKED=$(find frontend/release -maxdepth 1 -type d -name 'linux*unpacked' | head -1)" >> "$GITHUB_ENV"
          # GitHub release assets are capped at 2 GiB; fail clearly rather than at upload time.
          if [ "$size" -ge 2147483648 ]; then echo "::error::AppImage is $((size / 1048576)) MiB, over GitHub's 2 GiB release-asset limit"; exit 1; fi

      - name: Smoke-test the packaged app (start, use, quit)
        run: |
          APPIMAGE="$(ls frontend/release/*.AppImage | head -1)"
          chmod +x "$APPIMAGE"
          bash .github/scripts/smoke_test_app_linux.sh "$APPIMAGE" default
          PSYCHREPORT_NO_SANDBOX=1 bash .github/scripts/smoke_test_app_linux.sh "$APPIMAGE" no-sandbox

      - name: Smoke-test the AppImage mounted normally (FUSE)
        # How most users run it. Informational: not every CI machine allows FUSE mounts.
        continue-on-error: true
        run: |
          APPIMAGE="$(ls frontend/release/*.AppImage | head -1)"
          USE_FUSE=1 bash .github/scripts/smoke_test_app_linux.sh "$APPIMAGE" fuse

      - name: AI generation with the bundled Ollama
        run: bash .github/scripts/ai_generation_check_linux.sh "$UNPACKED/resources"

      - name: Attach the AppImage to the release
        # Only reached if every check above passed, so only a verified build is published.
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" frontend/release/*.AppImage --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload the AppImage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: PsychReportGen-linux-${{ matrix.arch }}
          path: frontend/release/*.AppImage
          if-no-files-found: warn
          compression-level: 0
